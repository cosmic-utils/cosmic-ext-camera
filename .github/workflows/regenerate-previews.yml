name: Regenerate Preview Screenshots

# Keeps the committed preview screenshots (preview/*.png plus the variant and
# per-locale galleries) in sync with the UI after it changes on main.
#
# This is the sibling of "Regenerate Derived Files", but it cannot push to main
# the way that job does: the screenshots are produced by rendering the app in a
# pinned container and can only be signed off by a human looking at the images,
# so a regenerated set is proposed as a pull request rather than committed
# straight to the branch.
#
# It is a separate workflow because the capture harness renders the app in a
# pinned container and takes roughly half an hour of wall clock. It needs no
# camera and no device access: the app fakes its own camera in CPU memory
# (--preview-fake-camera plus --preview-source), so no dma-buf provider is
# involved and it runs on a stock hosted runner.
#
# Self-retrigger is avoided by the paths filter below: it lists only the *inputs*
# that affect the screenshots, never the screenshot outputs, so merging this
# job's own PR (which only touches preview/) does not start it again.

on:
  push:
    branches: [main]
    paths:
      # UI code — the main reason a screenshot changes.
      - 'src/**'
      # The harness itself and what it feeds the app.
      - 'preview/shots.conf'
      - 'preview/source/**'
      - 'preview/capture-previews.sh'
      - 'preview/sync-previews.sh'
      - 'preview/Containerfile'
      # Dependency bumps (e.g. libcosmic) can change how the app renders.
      - 'Cargo.lock'
      # Localized shot text — the per-locale galleries render translated strings.
      - 'i18n/**'
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Re-capture every shot that changed at all, ignoring the churn
          thresholds. Use after a deliberate global restyle.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Only the newest main matters. Cancel an in-flight regeneration when a newer
# commit lands rather than queueing another ~30-minute run behind it.
concurrency:
  group: regenerate-previews
  cancel-in-progress: true

jobs:
  regenerate-previews:
    name: Regenerate and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        # Fetch Git LFS objects (the committed preview screenshots).
        # LFS download bandwidth is billed to the repository owner even for public repos:
        # https://docs.github.com/en/billing/managing-billing-for-git-large-file-storage/about-billing-for-git-large-file-storage
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Free up disk space
        # The pinned Fedora image, the release build and the container layers do
        # not fit alongside the runner's preinstalled SDKs.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Cache Rust build
        # generate-previews.sh points CARGO_HOME and CARGO_TARGET_DIR at
        # .preview-cache, so caching it turns the ~9 minute from-scratch build
        # into an incremental one (only the camera crate recompiles). Keyed on
        # Cargo.lock: the compiled dependencies are reused until they change, and
        # restore-keys falls back to the most recent cache otherwise. The pinned
        # container keeps rustc constant, so the cached artifacts stay valid.
        uses: actions/cache@v6
        with:
          path: .preview-cache
          key: preview-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            preview-rust-

      - name: Cache container image
        # The Fedora image (dnf install of the toolchain) rebuilds only when the
        # Containerfile changes.
        id: image-cache
        uses: actions/cache@v6
        with:
          path: ~/preview-image.tar
          key: preview-image-${{ hashFiles('preview/Containerfile') }}

      - name: Build or load container image
        run: |
          if [ -f ~/preview-image.tar ]; then
            echo "Loading cached image"
            podman load -i ~/preview-image.tar
          else
            echo "Building image"
            podman build -t camera-previews -f preview/Containerfile .
            podman save -o ~/preview-image.tar camera-previews
          fi

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Regenerate previews
        # Renders every shot in the pinned container, pixel-compares against the
        # committed PNGs and overwrites only what actually changed, then refreshes
        # the README/metainfo galleries that reference them. The image is already
        # built/loaded above, so NO_BUILD_IMAGE skips rebuilding it here.
        #
        # `force` drops both churn thresholds to 0. They are area-based shares of
        # differing pixels, so they are blind to a change that recolours a small
        # number of pixels completely — a theme or accent change to the symbolic
        # glyphs in the title bar and chips moves ~0.03% of a shot with a worst
        # tile of ~6%, an order of magnitude under either threshold, and is
        # silently kept as "unchanged". Lowering the committed thresholds to
        # catch that would re-admit exactly the churn they exist to reject (a
        # timer digit ticking over is the same shape of change), so the escape
        # hatch is a deliberate, human-triggered run instead.
        #
        # 0 is not "rewrite everything": the accept test is `share > threshold`,
        # strictly, so a shot whose pixels are identical is still left alone.
        # A forced run commits exactly the shots that differ by at least one
        # pixel.
        env:
          CONTAINER_ENGINE: podman
          NO_BUILD_IMAGE: "1"
          PREVIEW_THRESHOLD: ${{ inputs.force && '0' || '' }}
          PREVIEW_TILE_THRESHOLD: ${{ inputs.force && '0' || '' }}
        run: just generate-previews

      - name: Open pull request if screenshots changed
        # peter-evans/create-pull-request does not support Git LFS: it rebuilds
        # commits from a computed diff, which bypasses the LFS clean filter and
        # never uploads the LFS objects, so the regenerated PNGs would land as
        # broken pointers. Commit with plain git plus an explicit `git lfs push`
        # instead, which routes the images through .gitattributes as pointers
        # and uploads their backing objects.
        # See https://github.com/peter-evans/create-pull-request/issues/422
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch=ci/regenerate-previews

          # Scope the commit to preview/ (PNGs + generated galleries). Metadata
          # under resources/ is owned by the "Regenerate Derived Files" job.
          git add preview

          if git diff --cached --quiet; then
            pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$pr_number" ]; then
              gh pr close "$pr_number" --comment \
                "Closing automatically because the latest regeneration from main produced no screenshot changes. This generated pull request is obsolete."
              echo "Closed stale pull request #$pr_number."
            fi

            remote_branch="$(git ls-remote --heads origin "refs/heads/$branch")"
            if [ -n "$remote_branch" ]; then
              git push origin --delete "$branch"
              echo "Deleted stale remote branch $branch."
            fi

            if [ -z "$pr_number" ] && [ -z "$remote_branch" ]; then
              echo "Previews already up to date; no pull request needed."
            fi
            exit 0
          fi

          git switch -C "$branch"
          git commit -m "chore: regenerate preview screenshots"

          # Upload the LFS objects first, then force-update the branch so a
          # re-run refreshes the existing PR rather than failing on it.
          git lfs push origin "$branch"
          git push --force origin "$branch"

          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            echo "Pull request #$pr_number already open for $branch; its branch was updated."
            exit 0
          fi

          body="$(printf '%s\n' \
            '## Preview screenshots' \
            '' \
            'The UI changed on `main`, so the committed preview screenshots were re-rendered in the pinned container. Only images whose pixels actually changed are included.' \
            '' \
            'Please review the image diffs before merging. This is a visual change that no automated check can sign off on.' \
            '' \
            '---' \
            '*Automatically created by the Regenerate Preview Screenshots workflow.*')"

          gh pr create \
            --base main \
            --head "$branch" \
            --label previews \
            --title "chore: regenerate preview screenshots" \
            --body "$body"
