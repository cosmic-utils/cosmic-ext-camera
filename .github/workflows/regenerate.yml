name: Regenerate Derived Files

# Keeps the committed generated files in sync with the sources they derive from.
#
# Both sources are changed by bots that cannot regenerate the derived files
# themselves: Dependabot updates Cargo.lock, and Weblate updates the Fluent
# translations. Failing CI on drift would therefore red-flag exactly the pull
# requests that are unable to fix it, so this regenerates after the fact
# instead.
#
# There is no risk of the workflow retriggering itself: its own commit only
# touches generated files, and none of those appear in the paths filter below.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'requirements-build.txt'
      - 'justfile'
      - 'i18n/**'
      - 'scripts/gen-metadata.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate and commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Fetch Git LFS objects (the committed preview screenshots).
        # LFS download bandwidth is billed to the repository owner even for public repos:
        # https://docs.github.com/en/billing/managing-billing-for-git-large-file-storage/about-billing-for-git-large-file-storage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
          python3 -m pip install --requirement requirements-build.txt

      - name: Regenerate derived files
        run: just generate

      - name: Validate generated metadata
        run: just validate-metadata

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cargo-sources.json resources/ preview/README.md

          if git diff --staged --quiet; then
            echo "Nothing to regenerate"
          else
            git commit -m "chore: regenerate derived files"
            # resources/ can include LFS-tracked icons; upload any LFS objects
            # before pushing in case the runner has no LFS pre-push hook set up.
            git lfs push origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
            echo "Pushed regenerated files"
          fi
