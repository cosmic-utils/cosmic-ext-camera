name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_aarch64_flatpak:
        description: 'Build aarch64 Flatpak (slow, ~6 hours with QEMU)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Validates the desktop entry and AppStream metadata against their
  # specifications. This deliberately does not fail on the generated files being
  # out of date: Weblate cannot regenerate them, so the regenerate workflow
  # brings them back into sync after merge instead.
  metadata:
    name: Validate Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Validate desktop and metainfo files
        run: just validate-metadata

  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # skip the slow apt-get remove (~2 min); the other toggles free enough disk
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Read Rust toolchain
        id: toolchain
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy

      - name: Set up native dependencies and libcamera 0.7.2
        run: >-
          bash scripts/ci-native-setup.sh
          libglib2.0-dev
          gstreamer1.0-plugins-base
          gstreamer1.0-plugins-good
          gstreamer1.0-plugins-bad
          gstreamer1.0-plugins-ugly
          gstreamer1.0-libav
          ffmpeg

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-all-crates: true

      - name: Run checks
        run: just check


  # Cross-compiled debug builds to verify compilation on all target architectures
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - arch: armhf
            target: armv7-unknown-linux-gnueabihf
            use_cross: true
          - arch: riscv64
            target: riscv64gc-unknown-linux-gnu
            use_cross: true
          - arch: x86_64-musl
            target: x86_64-unknown-linux-musl
            use_cross: true
          - arch: aarch64-musl
            target: aarch64-unknown-linux-musl
            use_cross: true
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # skip the slow apt-get remove (~2 min); the other toggles free enough disk
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Read Rust toolchain
        id: toolchain
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.arch }}
          cache-all-crates: true

      - name: Set up native dependencies and libcamera 0.7.2 (native build)
        if: ${{ !matrix.use_cross }}
        run: bash scripts/ci-native-setup.sh libglib2.0-dev

      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross --rev a9301e91f72bba3850460512685f6b16062015ff

      - name: Install and verify podman
        if: ${{ matrix.use_cross }}
        run: bash scripts/ci-oci-probe.sh

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Build debug binary
        env:
          CROSS_CONTAINER_ENGINE: podman
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --target ${{ matrix.target }}
          else
            just build-debug --target ${{ matrix.target }}
          fi

  apkbuild:
    name: APKBUILD
    runs-on: ubuntu-latest
    needs: check
    container:
      image: alpine:edge
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache \
            alpine-sdk sudo git atools \
            cargo-auditable \
            clang-libclang \
            cmake \
            dav1d-dev \
            eudev-dev \
            glib-dev \
            gst-plugins-base-dev \
            gstreamer-dev \
            just \
            libcamera-dev \
            libxkbcommon-dev \
            nasm \
            pkgconf \
            samurai \
            wayland-dev

      - name: Set up abuild
        run: |
          adduser -D builder
          addgroup builder abuild
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          sudo -Hu builder abuild-keygen -a -n
          # Newer abuild writes keys to ~/.config/abuild; older versions use ~/.abuild
          for d in /home/builder/.config/abuild /home/builder/.abuild; do
            [ -d "$d" ] && cp "$d"/*.rsa.pub /etc/apk/keys/ || true
          done
          # Fail loudly here rather than midway through abuild -r if no key was found
          ls /etc/apk/keys/*.rsa.pub

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Generate APKBUILD and source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          # Create source tarball matching GitHub's archive format
          git archive --format=tar.gz --prefix=cosmic-ext-camera-$VERSION/ HEAD > /tmp/cosmic-ext-camera-$VERSION.tar.gz
          CHECKSUM=$(sha512sum /tmp/cosmic-ext-camera-$VERSION.tar.gz | awk '{print $1}')

          # Place tarball in distfiles cache where abuild expects it
          mkdir -p /var/cache/distfiles
          cp /tmp/cosmic-ext-camera-$VERSION.tar.gz /var/cache/distfiles/cosmic-ext-camera-$VERSION.tar.gz
          chmod 644 /var/cache/distfiles/cosmic-ext-camera-$VERSION.tar.gz

          # Generate APKBUILD from template
          mkdir -p /home/builder/apkbuild
          sed -e "s/@@VERSION@@/$VERSION/g" \
              -e "s/@@CHECKSUM@@/$CHECKSUM/g" \
              .github/APKBUILD.template > /home/builder/apkbuild/APKBUILD
          chown -R builder:builder /home/builder/apkbuild

      - name: Lint APKBUILD
        run: apkbuild-lint /home/builder/apkbuild/APKBUILD

      - name: Build package
        run: |
          cd /home/builder/apkbuild
          sudo -Hu builder abuild -r

  flatpak-x86_64:
    name: Flatpak (x86_64)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # skip the slow apt-get remove (~2 min); the other toggles free enough disk
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install Flatpak dependencies
        run: just flatpak-deps x86_64

      # Regenerate cargo-sources.json from Cargo.lock before building so the
      # offline Flatpak build sees the current crate set. Dependabot bumps
      # Cargo.lock but cannot regenerate this derived file, which would
      # otherwise fail the build with a stale vendored crate. Not committed
      # here; regenerate.yml reconciles the committed file after merge.
      - name: Regenerate cargo sources
        run: just flatpak-cargo-sources

      - name: Build Flatpak bundle
        run: just flatpak-bundle x86_64

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera-x86_64.flatpak
          path: camera-x86_64.flatpak
          if-no-files-found: error
          retention-days: 7

  flatpak-aarch64:
    name: Flatpak (aarch64)
    runs-on: ubuntu-latest
    needs: check
    # Only run on manual trigger with build_aarch64_flatpak=true
    if: github.event_name == 'workflow_dispatch' && inputs.build_aarch64_flatpak
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # skip the slow apt-get remove (~2 min); the other toggles free enough disk
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Add Flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install Flatpak dependencies
        run: just flatpak-deps aarch64

      - name: Build Flatpak bundle
        run: just flatpak-bundle aarch64

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera-aarch64.flatpak
          path: camera-aarch64.flatpak
          if-no-files-found: error
          retention-days: 7
