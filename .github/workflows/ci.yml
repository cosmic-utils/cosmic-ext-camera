name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_aarch64_flatpak:
        description: 'Build aarch64 Flatpak (slow, ~6 hours with QEMU)'
        required: false
        default: false
        type: boolean
      build_armhf_flatpak:
        description: 'Build armhf Flatpak (slow, uses QEMU)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Validates the desktop entry and AppStream metadata against their
  # specifications. This deliberately does not fail on the generated files being
  # out of date: Weblate cannot regenerate them, so the regenerate workflow
  # brings them back into sync after merge instead.
  metadata:
    name: Validate Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Validate desktop and metainfo files
        run: just validate-metadata

  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # skip the slow apt-get remove (~2 min); the other toggles free enough disk
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libwayland-dev \
            libxkbcommon-dev \
            libinput-dev \
            libudev-dev \
            libseat-dev \
            libclang-dev \
            cmake \
            nasm \
            meson \
            ninja-build \
            python3-jinja2 \
            python3-yaml \
            python3-ply \
            libyaml-dev

      # Built from source: ubuntu-latest (currently Ubuntu 24.04) ships only
      # libcamera 0.2.0 in apt. Keep this pinned to the same release and commit as
      # the Flatpak manifest until the runner packages libcamera 0.7.2 or newer.
      - name: Build and install libcamera 0.7.2
        run: |
          git clone --depth 1 --branch v0.7.2 https://git.libcamera.org/libcamera/libcamera.git /tmp/libcamera
          cd /tmp/libcamera
          test "$(git rev-parse HEAD)" = 191e202178f02430b5942397c70d215cdd2056fa
          meson setup build -Dprefix=/usr -Dpipelines=uvcvideo,simple -Dipas=simple -Dgstreamer=disabled -Dtest=false -Dcam=disabled -Dqcam=disabled -Dlc-compliance=disabled -Dtracing=disabled -Ddocumentation=disabled -Dpycamera=disabled
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Run checks
        run: just check


  # Cross-compiled debug builds to verify compilation on all target architectures
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - arch: armhf
            target: armv7-unknown-linux-gnueabihf
            use_cross: true
          - arch: riscv64
            target: riscv64gc-unknown-linux-gnu
            use_cross: true
          - arch: x86_64-musl
            target: x86_64-unknown-linux-musl
            use_cross: true
          - arch: aarch64-musl
            target: aarch64-unknown-linux-musl
            use_cross: true
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # skip the slow apt-get remove (~2 min); the other toggles free enough disk
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          cache-all-crates: true

      - name: Install system dependencies (native build)
        if: ${{ !matrix.use_cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libinput-dev \
            libudev-dev \
            libseat-dev \
            libclang-dev \
            cmake \
            nasm \
            meson \
            ninja-build \
            python3-jinja2 \
            python3-yaml \
            python3-ply \
            libyaml-dev

      # Built from source: ubuntu-latest (currently Ubuntu 24.04) ships only
      # libcamera 0.2.0 in apt. Keep this pinned to the same release and commit as
      # the Flatpak manifest until the runner packages libcamera 0.7.2 or newer.
      - name: Build and install libcamera 0.7.2 (native build)
        if: ${{ !matrix.use_cross }}
        run: |
          git clone --depth 1 --branch v0.7.2 https://git.libcamera.org/libcamera/libcamera.git /tmp/libcamera
          cd /tmp/libcamera
          test "$(git rev-parse HEAD)" = 191e202178f02430b5942397c70d215cdd2056fa
          meson setup build -Dprefix=/usr -Dpipelines=uvcvideo,simple -Dipas=simple -Dgstreamer=disabled -Dtest=false -Dcam=disabled -Dqcam=disabled -Dlc-compliance=disabled -Dtracing=disabled -Ddocumentation=disabled -Dpycamera=disabled
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install and verify podman
        if: ${{ matrix.use_cross }}
        # Runner image ubuntu24/20260726.254 bumped podman 4.9.3 -> 5.8.4, and
        # its podman cannot start a container with the crun that ships alongside:
        #   error running container: from /usr/bin/crun ...: unknown version specified
        # Every `cross` build died there, on whichever jobs happened to land on
        # the new image. Rather than assume which component is at fault, smoke
        # test the default runtime and only switch to runc when it is broken —
        # so this keeps working once the image is fixed upstream.
        run: |
          set -euo pipefail
          command -v podman >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y podman; }
          echo "podman: $(podman --version)"
          echo "crun:   $(crun --version 2>/dev/null | head -1 || echo 'not installed')"
          echo "runc:   $(runc --version 2>/dev/null | head -1 || echo 'not installed')"

          # A pull failure (Docker Hub rate limits) must not be mistaken for a
          # broken runtime, so only the `run` result decides anything.
          probe=docker.io/library/busybox:latest
          if ! podman pull -q "$probe" >/dev/null 2>&1; then
            echo "::warning::could not pull $probe; skipping OCI runtime check"
            exit 0
          fi

          if podman run --rm "$probe" true; then
            echo "Default OCI runtime works"
            exit 0
          fi

          echo "Default OCI runtime cannot start a container; falling back to runc"
          if ! command -v runc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y runc
          fi
          mkdir -p ~/.config/containers
          printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
          # Fail here rather than 10 minutes into the build if runc is no better.
          podman run --rm "$probe" true
          echo "Using runc"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build debug binary
        env:
          CROSS_CONTAINER_ENGINE: podman
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            CROSS_BUILD_OPTS="--build-arg RUST_VERSION=$(rustc -V | cut -d' ' -f2)" \
              cross build --target ${{ matrix.target }}
          else
            just build-debug --target ${{ matrix.target }}
          fi

  apkbuild:
    name: APKBUILD
    runs-on: ubuntu-latest
    needs: check
    container:
      image: alpine:edge
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache \
            alpine-sdk sudo git atools \
            cargo-auditable \
            clang-libclang \
            cmake \
            glib-dev \
            gst-plugins-base-dev \
            gstreamer-dev \
            just \
            libcamera-dev \
            libxkbcommon-dev \
            nasm \
            pkgconf \
            samurai \
            wayland-dev

      - name: Set up abuild
        run: |
          adduser -D builder
          addgroup builder abuild
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          sudo -Hu builder abuild-keygen -a -n
          # Newer abuild writes keys to ~/.config/abuild; older versions use ~/.abuild
          for d in /home/builder/.config/abuild /home/builder/.abuild; do
            [ -d "$d" ] && cp "$d"/*.rsa.pub /etc/apk/keys/ || true
          done
          # Fail loudly here rather than midway through abuild -r if no key was found
          ls /etc/apk/keys/*.rsa.pub

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Generate APKBUILD and source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          # Create source tarball matching GitHub's archive format
          git archive --format=tar.gz --prefix=cosmic-ext-camera-$VERSION/ HEAD > /tmp/cosmic-ext-camera-$VERSION.tar.gz
          CHECKSUM=$(sha512sum /tmp/cosmic-ext-camera-$VERSION.tar.gz | awk '{print $1}')

          # Place tarball in distfiles cache where abuild expects it
          mkdir -p /var/cache/distfiles
          cp /tmp/cosmic-ext-camera-$VERSION.tar.gz /var/cache/distfiles/cosmic-ext-camera-$VERSION.tar.gz
          chmod 644 /var/cache/distfiles/cosmic-ext-camera-$VERSION.tar.gz

          # Generate APKBUILD from template
          mkdir -p /home/builder/apkbuild
          sed -e "s/@@VERSION@@/$VERSION/g" \
              -e "s/@@CHECKSUM@@/$CHECKSUM/g" \
              .github/APKBUILD.template > /home/builder/apkbuild/APKBUILD
          chown -R builder:builder /home/builder/apkbuild

      - name: Lint APKBUILD
        run: apkbuild-lint /home/builder/apkbuild/APKBUILD

      - name: Build package
        run: |
          cd /home/builder/apkbuild
          sudo -Hu builder abuild -r

  flatpak-x86_64:
    name: Flatpak (x86_64)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # skip the slow apt-get remove (~2 min); the other toggles free enough disk
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Flatpak dependencies
        run: just flatpak-deps x86_64

      # Regenerate cargo-sources.json from Cargo.lock before building so the
      # offline Flatpak build sees the current crate set. Dependabot bumps
      # Cargo.lock but cannot regenerate this derived file, which would
      # otherwise fail the build with a stale vendored crate. Not committed
      # here; regenerate.yml reconciles the committed file after merge.
      - name: Regenerate cargo sources
        run: just flatpak-cargo-sources

      - name: Build Flatpak bundle
        run: just flatpak-bundle x86_64

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: camera-x86_64.flatpak
          path: camera-x86_64.flatpak
          if-no-files-found: error
          retention-days: 7

  flatpak-aarch64:
    name: Flatpak (aarch64)
    runs-on: ubuntu-latest
    needs: check
    # Only run on manual trigger with build_aarch64_flatpak=true
    if: github.event_name == 'workflow_dispatch' && inputs.build_aarch64_flatpak
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # skip the slow apt-get remove (~2 min); the other toggles free enough disk
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Add Flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Flatpak dependencies
        run: just flatpak-deps aarch64

      - name: Build Flatpak bundle
        run: just flatpak-bundle aarch64

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: camera-aarch64.flatpak
          path: camera-aarch64.flatpak
          if-no-files-found: error
          retention-days: 7

  flatpak-armhf:
    name: Flatpak (armhf)
    runs-on: ubuntu-latest
    needs: check
    # Only run on manual trigger with build_armhf_flatpak=true
    if: github.event_name == 'workflow_dispatch' && inputs.build_armhf_flatpak
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # skip the slow apt-get remove (~2 min); the other toggles free enough disk
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Add Flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Flatpak dependencies
        run: just flatpak-deps arm

      - name: Build Flatpak bundle
        run: |
          just flatpak-bundle arm
          # Flatpak calls the architecture arm, the release assets call it armhf
          mv camera-arm.flatpak camera-armhf.flatpak

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: camera-armhf.flatpak
          path: camera-armhf.flatpak
          if-no-files-found: error
          retention-days: 7
