[package]
name = "camera"
version = "1.3.7"
edition = "2024"
license = "GPL-3.0-only"
description = "Modern camera app for Linux desktops and phones"
repository = "https://github.com/cosmic-utils/cosmic-ext-camera"
authors = ["Frederic Laing <dev@fredfunk.tech>"]

[dependencies]
# Pure-Rust client for the PulseAudio wire protocol. Used to enumerate audio
# sources and to boost the selected source to 100% before recording — avoids
# shelling out to `pactl`/`pw-dump`, which are not shipped inside the
# `org.freedesktop.Platform` flatpak runtime.
pulseaudio = "0.3.2"
futures = "0.3.34"
i18n-embed = { version = "0.16.0", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10.1"
open = "5.4.5"
pollster = "1.0.1"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
# Keep dependency log-facade records on the same application subscriber.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log"] }
gstreamer = { version = "0.25.4", features = ["v1_20"] }
gstreamer-app = { version = "0.25.2", features = ["v1_20"] }
gstreamer-video = "0.25.4"
image = { version = "0.25.10", features = ["avif-native"] }
chrono = "0.4.45"
ctrlc = "3.5.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "7.0.0"
rqrr = "0.11.0"
rfd = "0.17.2"
# Keep the default runtime: synchronous portal guards use block_on, and its
# helper thread keeps their connections alive between calls.
zbus = "6.2.1"
# XDG portal integration for color-scheme detection on non-COSMIC desktops
ashpd = { version = "0.13.13", default-features = false, features = [
    "open_uri",
    "settings",
    "tokio",
] }
uuid = { version = "1.29.0", features = ["v4"] }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
libc = "0.2.191"
udev = "0.9.3"
# Direct Wayland connection for reading wl_output.geometry.transform - the
# compositor's display-rotation signal, used by the display_orientation
# backend so the camera preview reorients with the phone.
wayland-client = "0.31.15"
dng = "1.6.0"
async-stream = "0.3.6"
# Native libcamera bindings for direct camera access (bypasses GStreamer)
libcamera = "0.8.0"
drm-fourcc = "2.2.0"
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake"] }
little_exif = "0.6.23"
crc32fast = "1.5.4"

[dependencies.iced_core]
git = "https://github.com/pop-os/libcosmic.git"

[dependencies.iced_wgpu]
git = "https://github.com/pop-os/libcosmic.git"

[dependencies.iced_futures]
git = "https://github.com/pop-os/libcosmic.git"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Accessibility support
    "a11y",
    # About widget for the app
    "about",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
    # Add Wayland support to winit
    "wayland",
    # GPU-accelerated rendering
    "wgpu",
    # XDG portal integration for Flatpak theme detection
    "xdg-portal",
]

[profile.release]
lto = "fat"
codegen-units = 1
strip = false
debug = 1

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
debug = 0
opt-level = 1

[dev-dependencies]
log = "0.4.35"
naga = { version = "30.0.1", features = ["wgsl-in"] }

# Use the 0.8.0 bindings, including the matching low-level C++ bridge.
[patch.crates-io]
libcamera = { git = "https://github.com/FreddyFunk/libcamera-rs.git", branch = "feature/0.8.0" }
libcamera-sys = { git = "https://github.com/FreddyFunk/libcamera-rs.git", branch = "feature/0.8.0" }



# ------------------------------------------------------------
# Development overrides
#
# Uncomment the relevant patch entries when testing local
# changes to libcosmic or libcamera-rs.
#
# Paths assume sibling checkouts:
#   ~/git/cosmic-ext-camera/
#   ~/git/libcosmic/
#   ~/git/libcamera-rs/
# ------------------------------------------------------------

# Local libcosmic development
#
# [patch."https://github.com/pop-os/libcosmic"]
# libcosmic = { path = "../libcosmic" }
# iced_core = { path = "../libcosmic/iced/core" }
# iced_wgpu = { path = "../libcosmic/iced/wgpu" }
# iced_futures = { path = "../libcosmic/iced/futures" }

# Local libcamera-rs development
#
# Replace the entries in [patch.crates-io] above for local development:
# libcamera = { path = "../libcamera-rs/libcamera" }
# libcamera-sys = { path = "../libcamera-rs/libcamera-sys" }
